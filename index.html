<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#F7F4EA">
<title>Watchlog</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watchlog">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #F7F4EA; font-family: 'Courier Prime', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    overscroll-behavior-y: none;
    height: 100%;
  }

  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 90px; background: #F7F4EA; }

  .paper {
    background: #F7F4EA;
    min-height: 100vh;
    border-left: 1px solid #cfc2a3;
    border-right: 1px solid #cfc2a3;
    position: relative;
    color: #3a352b;
  }

  /* header */
  .header { padding: 26px 20px 14px; text-align: center; position: relative; }
  .header::before, .header::after {
    content: ""; position: absolute; top: 12px; width: 11px; height: 11px; border-radius: 50%;
    background: #2b2823; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .header::before { left: 16px; }
  .header::after { right: 16px; }
  .eyebrow { font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 10px; letter-spacing: 3px; color: #8a7d5f; margin-bottom: 4px; }
  .logo { font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 28px; letter-spacing: 5px; color: #3a352b; }
  .header hr { border: none; border-top: 1px dashed #b8a97e; margin: 14px 20px 0; }

  /* status tabs */
  .tabs-wrap { display: flex; align-items: center; gap: 22px; padding: 18px 18px 2px; flex-wrap: nowrap; overflow-x: auto; }
  .tab {
    font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 13px; color: #a89a76; cursor: pointer;
    padding: 4px 2px 8px; border-bottom: 2px solid transparent; user-select: none; white-space: nowrap; flex-shrink: 0;
  }
  .tab.on { color: #3a352b; border-bottom-color: #b23a2f; }
  .tab-icons { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }

  /* toolbar (search / backup icon buttons) */
  .toolbar-btn {
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    color: #8a7d5f; border: 1px dashed #b8a97e; width: 28px; height: 28px; border-radius: 4px; cursor: pointer;
    background: transparent; user-select: none; flex-shrink: 0;
  }
  .toolbar-btn:hover, .toolbar-btn.on { color: #3a352b; border-color: #3a352b; }
  .search-row { padding: 10px 18px 0; }
  .search-input {
    width: 100%; background: #fbf6e9; border: 1px solid #b8a97e; border-radius: 3px; padding: 9px 10px;
    color: #3a352b; font-family: 'Courier Prime', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 12px;
  }

  /* filter bar */
  .filters { display: flex; gap: 6px; padding: 14px 18px 4px; overflow-x: auto; }
  select {
    appearance: none; background: #e9dfc5; border: 1px solid #b8a97e; border-radius: 3px; color: #3a352b;
    font-family: 'Courier Prime', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 11px; padding: 6px 8px; cursor: pointer; white-space: nowrap;
    text-align: center; text-align-last: center;
  }

  /* table list */
  .list-wrap { padding: 10px 18px 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 9px; letter-spacing: 1px; color: #8a7d5f; border-bottom: 1px solid #b8a97e; padding: 5px 4px 8px; }
  td { padding: 10px 4px; border-bottom: 1px solid #d9cca9; vertical-align: top; cursor: pointer; }
  tr.row-item:hover td { background: rgba(178,58,47,0.04); }
  .no-cell { color: #a89a76; font-size: 10px; width: 26px; text-align: center; }
  .title-cell { font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 13px; line-height: 1.4; }
  .period-line { display: block; margin-top: 5px; font-size: 9px; color: #8a7d5f; letter-spacing: 0.2px; line-height: 1.4; }
  .period-line b { color: #b23a2f; font-weight: 700; }
  .leaf-cell { width: 40px; padding-left: 2px; padding-right: 2px; vertical-align: middle; }
  .leaf { width: 34px; height: 34px; margin: 0 auto; border: 1px solid #b8a97e; border-radius: 4px; overflow: hidden; background: #fffdf5; display: flex; flex-direction: column; }
  .leaf-m { flex: 0 0 13px; display: flex; align-items: center; justify-content: center; background: #b23a2f; color: #F7F4EA; font-size: 9px; font-weight: 700; line-height: 1; white-space: nowrap; }
  .leaf-d { flex: 1; display: flex; align-items: center; justify-content: center; font-family: 'Special Elite', 'Courier Prime', monospace; font-size: 14px; line-height: 1; color: #3a352b; }
  .genre-tag { display: inline-block; margin-top: 4px; font-size: 9px; color: #8a7d5f; border: 1px solid #b8a97e; padding: 1px 5px; border-radius: 2px; }
  .rating-cell { text-align: center; }
  .rating-wrap { display: inline-flex; flex-direction: column; align-items: flex-start; }
  .stars-cell { color: #3a352b; white-space: nowrap; font-size: 12px; }
  .stars-num { font-size: 9px; color: #8a7d5f; display: block; margin-top: 2px; text-align: left; }
  .no-rating { color: #cfc2a3; font-size: 11px; }
  .date-cell { white-space: nowrap; font-size: 10px; text-align: center; }
  .stamp {
    position: relative; display: inline-block; margin-top: 5px;
    border: 2px solid #b23a2f; color: #b23a2f; border-radius: 50%;
    width: 40px; height: 40px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 8px;
    line-height: 1; transform: rotate(-12deg); opacity: 0.85; padding: 0; mix-blend-mode: multiply;
  }
  .stamp > span { display: block; height: 11px; line-height: 11px; }
  .status-label { font-size: 10px; color: #a89a76; }
  .empty-msg { text-align: center; color: #a89a76; font-size: 12px; padding: 60px 20px; }

  /* 시청 회차 도장 + 진행바 (보는 중 드라마) */
  .ep-stamp-mini {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: 34px; height: 34px; border: 2px solid #b23a2f; color: #b23a2f; border-radius: 50%;
    transform: rotate(-8deg); cursor: pointer; user-select: none; margin: 4px auto; line-height: 1;
    transition: transform .12s ease; background: #F7F4EA;
  }
  .ep-stamp-mini:active { transform: rotate(-8deg) scale(0.88); }
  .ep-stamp-mini.slam { animation: stampSlam .5s cubic-bezier(.2,.8,.3,1); }
  .tl-wrap { margin: 8px 4px 4px 8px; padding-left: 18px; border-left: 1.5px dashed #b8a97e; }
  .tl-grp { position: relative; margin-bottom: 16px; }
  .tl-grp:last-child { margin-bottom: 0; }
  .tl-dot { position: absolute; left: -23.75px; top: 1px; width: 10px; height: 10px; border-radius: 50%; background: #b23a2f; }
  .tl-date { font-family: 'Special Elite', 'Courier Prime', monospace; font-size: 12px; color: #b23a2f; line-height: 1.2; margin-bottom: 4px; }
  .tl-date span { color: #8a7d5f; }
  .tl-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; border-bottom: 1px dashed #d9cca9; }
  .tl-item:last-child { border-bottom: none; }
  .tl-item:hover { background: rgba(178,58,47,0.04); }
  .tl-no { flex: none; width: 22px; font-size: 10px; color: #a89a76; }
  .tl-main { flex: 1; min-width: 0; }
  .tl-title { font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 13px; line-height: 1.4; }
  .tl-item .ep-stamp-mini { flex: none; margin: 0 4px 0 0; }
  tr.slam-row td, .tl-item.slam-row { animation: rowShake .25s ease-out .2s; }
  @keyframes stampSlam {
    0% { transform: rotate(-16deg) scale(1.9); opacity: .15; }
    55% { transform: rotate(-8deg) scale(.9); opacity: 1; }
    75% { transform: rotate(-8deg) scale(1.06); }
    100% { transform: rotate(-8deg) scale(1); }
  }
  @keyframes rowShake { 0%, 100% { transform: none; } 35% { transform: translateY(2px); } 65% { transform: translateY(-1px); } }
  .ep-stamp-mini.maxed { border-color: #8a7d5f; color: #8a7d5f; }
  .ep-mini-label { font-size: 7px; font-weight: 700; }
  .ep-mini-num { font-size: 12px; font-weight: 700; }
  .ep-bar-under { margin-top: 5px; display: flex; align-items: center; gap: 6px; }
  .ep-bar-mini-bg { flex: 1; max-width: 90px; height: 5px; background: #e9dfc5; border: 1px solid #b8a97e; border-radius: 3px; overflow: hidden; }
  .ep-bar-mini-fill { height: 100%; background: #b23a2f; }
  .ep-bar-mini-text { font-size: 9px; color: #8a7d5f; white-space: nowrap; }

  /* FAB */
  .fab {
    position: fixed; right: 20px; bottom: 78px; width: 52px; height: 52px; border-radius: 50%;
    background: #b23a2f; color: #F7F4EA; display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer; box-shadow: 0 4px 14px rgba(178,58,47,0.5); z-index: 30; border: none;
  }

  /* bottom country tabs */
  .bottom-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
    display: flex; background: #e9dfc5; border-top: 1px dashed #b8a97e; z-index: 20;
  }
  .bottom-bar .btab {
    flex: 1; text-align: center; padding: 14px 0; font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 13px;
    color: #a89a76; cursor: pointer; border-top: 2px solid transparent;
  }
  .bottom-bar .btab.on { color: #b23a2f; border-top-color: #b23a2f; }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,18,14,0.65); z-index: 50; display: flex;
    align-items: flex-end; justify-content: center;
  }
  .modal {
    background: #F7F4EA; width: 100%; max-width: 480px; border-radius: 14px 14px 0 0; padding: 20px 18px 26px;
    max-height: 88vh; overflow-y: auto; color: #3a352b;
  }
  .modal-title { font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 20px; letter-spacing: 1px; }
  .modal-close { font-size: 20px; cursor: pointer; color: #8a7d5f; }
  .field-label { font-size: 10px; color: #8a7d5f; margin: 14px 0 6px; letter-spacing: 1px; font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  input[type="text"], input[type="date"], textarea {
    width: 100%; background: #fbf6e9; border: 1px solid #b8a97e; border-radius: 4px; padding: 9px 10px;
    color: #3a352b; font-size: 13px; font-family: 'Courier Prime', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; box-sizing: border-box;
  }
  input[type="text"], input[type="date"] { height: 40px; }
  input[type="date"] { text-align: left; -webkit-appearance: none; appearance: none; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  textarea { resize: none; }
  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pick-pill {
    padding: 6px 12px; border-radius: 4px; font-size: 12px; font-family: 'Courier Prime', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-weight: 700;
    cursor: pointer; border: 1px solid #b8a97e; color: #8a7d5f; background: transparent; user-select: none;
  }
  .pick-pill.on { border-color: #b23a2f; color: #b23a2f; background: rgba(178,58,47,0.1); }
  .star-input { display: flex; gap: 3px; }
  .star-input svg { cursor: pointer; }
  .btn-row { display: flex; gap: 8px; margin-top: 20px; }
  .btn-save {
    flex: 1; background: #b23a2f; color: #F7F4EA; border: none; border-radius: 6px; padding: 13px;
    font-weight: 700; font-size: 14px; cursor: pointer; font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing: 1px;
  }
  .btn-delete {
    display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid #8a7d5f; color: #8a7d5f;
    border-radius: 6px; padding: 13px 16px; cursor: pointer; font-family: 'Courier Prime', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 13px;
  }

  /* backup modal */
  .backup-option {
    display: flex; align-items: center; gap: 10px; border: 1px solid #b8a97e; border-radius: 8px;
    padding: 14px; margin-bottom: 10px; cursor: pointer; background: #fbf6e9;
  }
  .backup-option:hover { border-color: #b23a2f; }
  .backup-option .icon { font-size: 20px; }
  .backup-option .label { font-family: 'Special Elite', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 13px; }
  .backup-option .desc { font-size: 10px; color: #8a7d5f; margin-top: 2px; }
  .backup-msg { font-size: 12px; padding: 10px 0; }
  .backup-msg.error { color: #b23a2f; }
  .backup-msg.info { color: #3a352b; }
  .btn-row-inline { display: flex; gap: 8px; margin-top: 6px; }
  .btn-cancel {
    flex: 1; background: transparent; border: 1px solid #8a7d5f; color: #8a7d5f; border-radius: 6px;
    padding: 12px; font-family: 'Courier Prime', system-ui, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app"><div class="paper" id="paper"></div></div>

<script>
const STORAGE_ITEMS = "watchlog:items";
const STORAGE_CATEGORIES = "watchlog:categories";
const STORAGE_NATIONS = "watchlog:nations";
const STORAGE_SHOWHOLD = "watchlog:showhold";
const DEFAULT_CATEGORIES = ["영화", "드라마", "예능", "연애예능"];
const DEFAULT_NATIONS = ["일본", "미국", "중국", "영국", "태국"];
const STATUSES = ["볼 예정", "보는 중", "보류", "완료"];
const STATUS_DATE_LABEL = { "볼 예정": "대출예정", "보는 중": "대출중", "보류": "보류중" };

let state = {
  items: [],
  categories: DEFAULT_CATEGORIES.slice(),
  nations: DEFAULT_NATIONS.slice(),
  showHold: false,
  country: "국내",
  status: "보는 중",
  fYear: "", fMonth: "", fRating: "", fCategory: "", fNation: "",
  searchQuery: "",
  searchOpen: false,
  sortBy: "createdDesc",
  backupStep: null, // null | 'menu' | 'confirmImport' | 'error'
  backupPending: null,
  backupErrorMsg: "",
  modal: null,
  modalDraft: null,
  loaded: false,
};

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dateFromTs(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function daysBetween(a, b) {
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
}
// 예전에 추가한 기록은 addedDate가 없으니 createdAt(만든 시각)에서 채워줌
function ensureAddedDates() {
  let changed = false;
  state.items.forEach((i) => {
    if (!i.addedDate) { i.addedDate = dateFromTs(i.createdAt); changed = true; }
  });
  return changed;
}
// 글꼴마다 글자 잉크가 위/아래로 쏠려서 가운데 정렬이 어긋나 보이는 걸 글자별로 보정
const VC_SELECTOR = ".leaf-m, .leaf-d, .stamp > span, .ep-mini-label, .ep-mini-num, .genre-tag, .pick-pill, .btab, .fab, .btn-save, .toolbar-btn";
let vcCtx = null;
function centerText(root) {
  try {
    if (!vcCtx) vcCtx = document.createElement("canvas").getContext("2d");
    const probe = document.createElement("span");
    probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline;";
    (root || document).querySelectorAll(VC_SELECTOR).forEach((el) => {
      // 배경/테두리는 그대로 두고 글자만 움직이도록 글자를 span(.vt)으로 감싸서 그 span만 이동
      let vt = el.querySelector(":scope > .vt");
      if (!vt) {
        const text0 = (el.textContent || "").trim();
        if (!text0 || el.children.length || /\p{Extended_Pictographic}/u.test(text0)) return;
        vt = document.createElement("span");
        vt.className = "vt";
        vt.style.display = "inline-block";
        while (el.firstChild) vt.appendChild(el.firstChild);
        el.appendChild(vt);
      }
      vt.style.translate = "";
      const text = (vt.textContent || "").trim();
      if (!text) return;
      // 도장처럼 기울어진 부모는 잠깐 펴서 재야 정확함
      const rot = el.closest(".stamp, .ep-stamp-mini");
      const savedT = rot ? rot.style.transform : "";
      if (rot) rot.style.transform = "none";
      const cs = getComputedStyle(vt);
      vcCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const m = vcCtx.measureText(text);
      vt.insertBefore(probe, vt.firstChild);
      const baseline = probe.getBoundingClientRect().bottom;
      probe.remove();
      const r = el.getBoundingClientRect();
      if (rot) rot.style.transform = savedT;
      const boxCenter = r.top + el.clientTop + el.clientHeight / 2;
      const inkCenter = baseline - (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
      let off = boxCenter - inkCenter;
      off = Math.max(-5, Math.min(5, Math.round(off * 10) / 10));
      if (off) vt.style.translate = `0 ${off}px`;
    });
  } catch (e) {}
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => centerText());

function dateLabel(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const n = daysBetween(dateStr, todayStr());
  const ago = n === 0 ? "오늘" : n === 1 ? "어제" : n > 1 ? n + "일 전" : "";
  const yy = y !== new Date().getFullYear() ? y + "년 " : "";
  return `${yy}${m}월 ${d}일${ago ? ` <span>· ${ago}</span>` : ""}`;
}
// 보는 중 탭: 추가한 날짜별로 묶어서 보여주는 타임라인
function timelineMarkup(list, orderMap) {
  const groups = [];
  list.forEach((it) => {
    const last = groups[groups.length - 1];
    if (last && last.date === (it.addedDate || "")) last.items.push(it);
    else groups.push({ date: it.addedDate || "", items: [it] });
  });
  return `<div class="tl-wrap">${groups.map((g) => `
    <div class="tl-grp">
      <span class="tl-dot"></span>
      <div class="tl-date">${g.date ? dateLabel(g.date) : "날짜 없음"}</div>
      ${g.items.map((item) => `
        <div class="tl-item row-item" data-id="${item.id}">
          <span class="tl-no">${String(orderMap.get(item.id) || 0).padStart(3, "0")}</span>
          <div class="tl-main">
            <div class="tl-title">${escapeHtml(item.title)}</div>
            <span class="genre-tag">${escapeHtml(item.category)} · ${item.country === "해외" && item.nation ? escapeHtml(item.nation) : item.country}</span>
            ${hasEp(item) ? epBarMarkup(item) : ""}
          </div>
          ${hasEp(item) ? epStampMarkup(item) : ""}
        </div>`).join("")}
    </div>`).join("")}</div>`;
}
function leafMarkup(item) {
  if (!item.addedDate) return `<span class="no-rating">—</span>`;
  const [y, m, d] = item.addedDate.split("-").map(Number);
  const yy = y !== new Date().getFullYear() ? String(y).slice(2) + "." : "";
  return `<div class="leaf"><span class="leaf-m">${yy}${m}월</span><span class="leaf-d">${d}</span></div>`;
}
function periodMarkup(item) {
  if (!item.addedDate) return "";
  return `<span class="period-line">추가 ${item.addedDate}</span>`;
}
// 완료 도장 안에 걸린 기간 표시 (추가일 정보가 없거나 날짜가 거꾸로면 DONE)
function stampBottom(item) {
  if (!item.addedDate || !item.completedDate) return "DONE";
  const n = daysBetween(item.addedDate, item.completedDate);
  if (n < 0) return "DONE";
  return n === 0 ? "당일" : n + "일";
}

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

async function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_ITEMS);
    if (raw) state.items = JSON.parse(raw);
  } catch (e) {}
  try {
    const raw = localStorage.getItem(STORAGE_CATEGORIES);
    if (raw) state.categories = JSON.parse(raw);
  } catch (e) {}
  try {
    const raw = localStorage.getItem(STORAGE_NATIONS);
    if (raw) state.nations = JSON.parse(raw);
  } catch (e) {}
  try {
    const raw = localStorage.getItem(STORAGE_SHOWHOLD);
    if (raw) state.showHold = JSON.parse(raw);
  } catch (e) {}
  if (ensureAddedDates()) persistItems();
  state.loaded = true;
  render();
}

async function persistItems() {
  try { localStorage.setItem(STORAGE_ITEMS, JSON.stringify(state.items)); }
  catch (e) { console.error("저장 실패", e); }
}
async function persistCategories() {
  try { localStorage.setItem(STORAGE_CATEGORIES, JSON.stringify(state.categories)); }
  catch (e) { console.error("장르 저장 실패", e); }
}
async function persistNations() {
  try { localStorage.setItem(STORAGE_NATIONS, JSON.stringify(state.nations)); }
  catch (e) { console.error("국가 저장 실패", e); }
}
async function persistShowHold() {
  try { localStorage.setItem(STORAGE_SHOWHOLD, JSON.stringify(state.showHold)); }
  catch (e) {}
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function hasEp(item) {
  if (item.category === "영화") return false;
  if (item.category === "드라마") return true;
  return (parseInt(item.currentEp, 10) || 0) > 0 || (parseInt(item.totalEp, 10) || 0) > 0;
}

function epStampMarkup(item) {
  const cur = item.currentEp ? parseInt(item.currentEp, 10) : 0;
  const total = item.totalEp ? parseInt(item.totalEp, 10) : 0;
  const maxed = total > 0 && cur >= total;
  return `
    <div class="ep-stamp-mini ${maxed ? "maxed" : ""}" data-id="${item.id}">
      <span class="ep-mini-label">EP</span><span class="ep-mini-num">${cur}</span>
    </div>
  `;
}

function epBarMarkup(item) {
  const cur = item.currentEp ? parseInt(item.currentEp, 10) : 0;
  const total = item.totalEp ? parseInt(item.totalEp, 10) : 0;
  const pct = total > 0 ? Math.min(100, Math.round((cur / total) * 100)) : 0;
  return `
    <div class="ep-bar-under">
      ${total > 0 ? `
        <div class="ep-bar-mini-bg"><div class="ep-bar-mini-fill" style="width:${pct}%;"></div></div>
        <span class="ep-bar-mini-text">${cur}/${total}화</span>
      ` : `<span class="ep-bar-mini-text">${cur}화 시청 중</span>`}
    </div>
  `;
}

function starsMarkup(value) {
  const size = 14;
  let html = `<span class="stars-cell" style="display:inline-flex;gap:1px;vertical-align:middle;">`;
  for (let i = 0; i < 5; i++) {
    const fill = Math.max(0, Math.min(1, value - i));
    html += `
      <span style="position:relative;display:inline-block;width:${size}px;height:${size}px;">
        <svg width="${size}" height="${size}" viewBox="0 0 24 24" style="position:absolute;top:0;left:0;">
          <path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8L6 21l1.6-7L2.2 9.2l7.1-.6L12 2z" fill="none" stroke="#cfc2a3" stroke-width="1.3"/>
        </svg>
        <span style="position:absolute;top:0;left:0;width:${fill * 100}%;height:${size}px;overflow:hidden;display:block;">
          <svg width="${size}" height="${size}" viewBox="0 0 24 24">
            <path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8L6 21l1.6-7L2.2 9.2l7.1-.6L12 2z" fill="#3a352b" stroke="#3a352b" stroke-width="1.3"/>
          </svg>
        </span>
      </span>
    `;
  }
  html += `</span>`;
  return html;
}

function getFilteredSorted() {
  let list = state.items.filter((i) => i.country === state.country && i.status === state.status);
  list = list.filter((i) => {
    if (state.fYear && (!i.completedDate || i.completedDate.slice(0, 4) !== state.fYear)) return false;
    if (state.fMonth && (!i.completedDate || i.completedDate.slice(5, 7) !== state.fMonth)) return false;
    if (state.fRating && Number(i.rating) !== Number(state.fRating)) return false;
    if (state.fCategory && i.category !== state.fCategory) return false;
    if (state.fNation && i.nation !== state.fNation) return false;
    if (state.searchQuery && !i.title.toLowerCase().includes(state.searchQuery.toLowerCase())) return false;
    return true;
  });
  const byAddedDesc = (a, b) => (b.addedDate || "").localeCompare(a.addedDate || "") || (b.createdAt || 0) - (a.createdAt || 0);
  list.sort((a, b) => {
    switch (state.sortBy) {
      case "completedDesc": return (b.completedDate || "").localeCompare(a.completedDate || "") || byAddedDesc(a, b);
      case "completedAsc": return (a.completedDate || "").localeCompare(b.completedDate || "") || byAddedDesc(b, a);
      case "ratingDesc": return (b.rating || 0) - (a.rating || 0) || byAddedDesc(a, b);
      case "ratingAsc": return (a.rating || 0) - (b.rating || 0) || byAddedDesc(a, b);
      case "createdAsc": return byAddedDesc(b, a);
      default: return byAddedDesc(a, b);
    }
  });
  return list;
}

function getYears() {
  const s = new Set(state.items.filter((i) => i.completedDate).map((i) => i.completedDate.slice(0, 4)));
  return Array.from(s).sort((a, b) => b.localeCompare(a));
}

function getOrderMap(country, status) {
  const scoped = state.items
    .filter((i) => i.country === country && i.status === status)
    .slice();
  scoped.sort((a, b) => (a.addedDate || "").localeCompare(b.addedDate || "") || (a.createdAt || 0) - (b.createdAt || 0));
  const map = new Map();
  scoped.forEach((it, idx) => map.set(it.id, idx + 1));
  return map;
}

function render() {
  const root = document.getElementById("paper");
  if (!state.loaded) { root.innerHTML = `<div style="padding:60px;text-align:center;color:#8a7d5f;">불러오는 중...</div>`; return; }

  const visibleStatuses = state.showHold ? STATUSES : STATUSES.filter((s) => s !== "보류");
  const filtered = getFilteredSorted();
  const years = getYears();
  const orderMap = getOrderMap(state.country, state.status);

  root.innerHTML = `
    <div class="header">
      <div class="eyebrow">PERSONAL VIEWING RECORD</div>
      <div class="logo">WATCHLOG</div>
      <hr/>
    </div>

    <div class="tabs-wrap">
      ${visibleStatuses.map((s) => `<div class="tab ${state.status === s ? "on" : ""}" data-status="${s}">${s}</div>`).join("")}
      <div class="tab-icons">
        <div class="toolbar-btn" id="holdToggle">${state.showHold ? "－" : "＋"}</div>
        <div class="toolbar-btn" id="backupToggleBtn">💾</div>
        <div class="toolbar-btn ${state.searchOpen ? "on" : ""}" id="searchToggleBtn">🔍</div>
      </div>
    </div>

    ${state.searchOpen ? `
      <div class="search-row">
        <input type="text" class="search-input" id="searchInput" placeholder="제목 검색..." value="${escapeHtml(state.searchQuery)}" />
      </div>
    ` : ""}

    <div class="filters">
      <select id="fCategory">
        <option value="">장르 전체</option>
        ${state.categories.map((c) => `<option value="${escapeHtml(c)}" ${state.fCategory === c ? "selected" : ""}>${escapeHtml(c)}</option>`).join("")}
      </select>
      ${state.country === "해외" ? `
        <select id="fNation">
          <option value="">국가 전체</option>
          ${state.nations.map((n) => {
            const cnt = state.items.filter((i) => i.country === "해외" && i.nation === n && i.status === "완료").length;
            return `<option value="${escapeHtml(n)}" ${state.fNation === n ? "selected" : ""}>${escapeHtml(n)} (${cnt})</option>`;
          }).join("")}
        </select>
      ` : ""}
      ${state.status === "완료" ? `
        <select id="fYear">
          <option value="">연도 전체</option>
          ${years.map((y) => `<option value="${y}" ${state.fYear === y ? "selected" : ""}>${y}년</option>`).join("")}
        </select>
        <select id="fMonth">
          <option value="">월 전체</option>
          ${Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, "0")).map((m) => `<option value="${m}" ${state.fMonth === m ? "selected" : ""}>${Number(m)}월</option>`).join("")}
        </select>
      ` : ""}
      <select id="fRating">
        <option value="">별점 전체</option>
        ${[5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1, 0.5].map((r) => `<option value="${r}" ${String(state.fRating) === String(r) ? "selected" : ""}>★${r}</option>`).join("")}
      </select>
      <select id="fSort">
        <option value="createdDesc" ${state.sortBy === "createdDesc" ? "selected" : ""}>최근 추가순</option>
        <option value="createdAsc" ${state.sortBy === "createdAsc" ? "selected" : ""}>먼저 추가순</option>
        ${state.status === "완료" ? `
          <option value="completedDesc" ${state.sortBy === "completedDesc" ? "selected" : ""}>완료일 최신순</option>
          <option value="completedAsc" ${state.sortBy === "completedAsc" ? "selected" : ""}>완료일 오래된순</option>
        ` : ""}
        <option value="ratingDesc" ${state.sortBy === "ratingDesc" ? "selected" : ""}>별점 높은순</option>
        <option value="ratingAsc" ${state.sortBy === "ratingAsc" ? "selected" : ""}>별점 낮은순</option>
      </select>
    </div>

    <div class="list-wrap">
      ${filtered.length === 0 ? `<div class="empty-msg">아직 기록이 없어요.<br/>오른쪽 아래 + 버튼으로 추가해보세요.</div>` : state.status === "보는 중" ? timelineMarkup(filtered, orderMap) : `
      <table>
        <tr>
          <th style="width:${state.status === "보는 중" ? 11 : 8}%;text-align:center;">${state.status === "보는 중" ? "ADDED" : "NO"}</th>
          <th style="width:${state.status === "보는 중" ? 33 : 36}%;">TITLE</th>
          <th style="width:28%;text-align:center;">RATING</th>
          <th style="width:28%;text-align:center;">STATUS</th>
        </tr>
        ${filtered.map((item) => `
          <tr class="row-item" data-id="${item.id}">
            ${state.status === "보는 중" ? `<td class="leaf-cell">${leafMarkup(item)}</td>` : `<td class="no-cell">${String(orderMap.get(item.id) || 0).padStart(3, "0")}</td>`}
            <td class="title-cell">${escapeHtml(item.title)}<br/><span class="genre-tag">${escapeHtml(item.category)} · ${item.country === "해외" && item.nation ? escapeHtml(item.nation) : item.country}</span>${item.status === "보는 중" ? "" : periodMarkup(item)}${item.status === "보는 중" && hasEp(item) ? epBarMarkup(item) : ""}</td>
            <td class="rating-cell">${item.status === "완료" ? `<span class="rating-wrap">${starsMarkup(item.rating || 0)}<span class="stars-num">${item.rating || 0}</span></span>` : `<span class="no-rating">—</span>`}</td>
            <td class="date-cell">
              ${item.status === "완료"
                ? `${item.completedDate || ""}<br/><div class="stamp"><span>완료</span><span>${stampBottom(item)}</span></div>`
                : item.status === "보류"
                ? `<span class="status-label">보류</span><br/>${item.holdDate || ""}`
                : item.status === "보는 중" && hasEp(item)
                ? epStampMarkup(item)
                : `<span class="status-label">${STATUS_DATE_LABEL[item.status] || item.status}</span>`}
            </td>
          </tr>
        `).join("")}
      </table>
      `}
    </div>
  `;

  document.querySelectorAll(".ep-stamp-mini").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const id = el.dataset.id;
    const item = state.items.find((i) => i.id === id);
    if (!item) return;
    const total = item.totalEp ? parseInt(item.totalEp, 10) : 0;
    const cur = item.currentEp ? parseInt(item.currentEp, 10) : 0;
    if (total > 0 && cur >= total) return; // 이미 총 화수 다 봤으면 더 안 올라감
    item.currentEp = cur + 1;
    persistItems();
    state.slamId = id;
    render();
  }));

  document.querySelectorAll(".tab").forEach((el) => el.addEventListener("click", () => {
    state.status = el.dataset.status;
    state.fYear = ""; state.fMonth = ""; state.fRating = ""; state.fCategory = ""; state.fNation = "";
    state.sortBy = "createdDesc";
    render();
  }));
  document.getElementById("holdToggle").addEventListener("click", () => {
    state.showHold = !state.showHold;
    if (!state.showHold && state.status === "보류") state.status = "완료";
    persistShowHold();
    render();
  });
  const fCategory = document.getElementById("fCategory");
  if (fCategory) fCategory.addEventListener("change", (e) => { state.fCategory = e.target.value; render(); });
  const fNation = document.getElementById("fNation");
  if (fNation) fNation.addEventListener("change", (e) => { state.fNation = e.target.value; render(); });
  const fYear = document.getElementById("fYear");
  if (fYear) fYear.addEventListener("change", (e) => { state.fYear = e.target.value; render(); });
  const fMonth = document.getElementById("fMonth");
  if (fMonth) fMonth.addEventListener("change", (e) => { state.fMonth = e.target.value; render(); });
  const fSort = document.getElementById("fSort");
  if (fSort) fSort.addEventListener("change", (e) => { state.sortBy = e.target.value; render(); });
  const fRating = document.getElementById("fRating");
  if (fRating) fRating.addEventListener("change", (e) => { state.fRating = e.target.value; render(); });

  const searchInput = document.getElementById("searchInput");
  if (searchInput) searchInput.addEventListener("input", (e) => {
    const pos = e.target.selectionStart;
    state.searchQuery = e.target.value;
    render();
    const el = document.getElementById("searchInput");
    el.focus();
    el.setSelectionRange(pos, pos);
  });
  document.getElementById("searchToggleBtn").addEventListener("click", () => {
    state.searchOpen = !state.searchOpen;
    if (!state.searchOpen) state.searchQuery = "";
    render();
    if (state.searchOpen) {
      const el = document.getElementById("searchInput");
      if (el) el.focus();
    }
  });
  document.getElementById("backupToggleBtn").addEventListener("click", () => {
    state.backupStep = "menu";
    state.backupPending = null;
    state.backupErrorMsg = "";
    renderBackupModal();
  });

  document.querySelectorAll(".row-item").forEach((el) => el.addEventListener("click", () => {
    const item = state.items.find((i) => i.id === el.dataset.id);
    openModal(item);
  }));

  renderFabAndBottom();
  centerText();
  if (state.slamId) {
    const el = document.querySelector(`.ep-stamp-mini[data-id="${state.slamId}"]`);
    state.slamId = null;
    if (el) {
      el.classList.add("slam");
      const tr = el.closest("tr, .tl-item");
      if (tr) tr.classList.add("slam-row");
    }
  }
}

function renderFabAndBottom() {
  let fab = document.getElementById("fab");
  if (!fab) {
    fab = document.createElement("button");
    fab.id = "fab";
    fab.className = "fab";
    fab.innerHTML = "+";
    fab.addEventListener("click", () => openModal(null));
    document.body.appendChild(fab);
  }
  let bottomBar = document.getElementById("bottomBar");
  if (!bottomBar) {
    bottomBar = document.createElement("div");
    bottomBar.id = "bottomBar";
    bottomBar.className = "bottom-bar";
    document.body.appendChild(bottomBar);
  }
  bottomBar.innerHTML = ["국내", "해외"].map((c) => `<div class="btab ${state.country === c ? "on" : ""}" data-country="${c}">${c}</div>`).join("");
  bottomBar.querySelectorAll(".btab").forEach((el) => el.addEventListener("click", () => {
    state.country = el.dataset.country;
    render();
  }));
}

function exportBackup() {
  const payload = {
    items: state.items,
    categories: state.categories,
    nations: state.nations,
    exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = todayStr();
  a.href = url;
  a.download = `watchlog-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function closeBackupModal() {
  state.backupStep = null;
  state.backupPending = null;
  state.backupErrorMsg = "";
  const existing = document.getElementById("backupOverlay");
  if (existing) existing.remove();
}

function renderBackupModal() {
  let overlay = document.getElementById("backupOverlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "backupOverlay";
    overlay.className = "overlay";
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeBackupModal(); });
  }

  let body = "";
  if (state.backupStep === "menu") {
    body = `
      <div class="backup-option" id="doExport">
        <div class="icon">⤓</div>
        <div>
          <div class="label">백업 파일 저장하기</div>
          <div class="desc">지금까지 기록한 모든 항목을 JSON 파일로 다운로드해요.</div>
        </div>
      </div>
      <div class="backup-option" id="doImportPick">
        <div class="icon">⤒</div>
        <div>
          <div class="label">백업 파일 불러오기</div>
          <div class="desc">저장해둔 백업 파일로 복원해요. 현재 데이터는 덮어씌워져요.</div>
        </div>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none;" />
    `;
  } else if (state.backupStep === "confirmImport") {
    const c = state.backupPending;
    body = `
      <div class="backup-msg info">백업 파일에서 <b>${c.count}개</b>의 기록을 찾았어요.<br/>불러오면 현재 데이터는 새 내용으로 바뀌어요. 계속할까요?</div>
      <div class="btn-row-inline">
        <div class="btn-cancel" id="importCancel">취소</div>
        <button class="btn-save" id="importConfirm">불러오기</button>
      </div>
    `;
  } else if (state.backupStep === "error") {
    body = `
      <div class="backup-msg error">${escapeHtml(state.backupErrorMsg)}</div>
      <div class="btn-row-inline">
        <div class="btn-cancel" id="errorBack">뒤로</div>
      </div>
    `;
  } else if (state.backupStep === "done") {
    body = `
      <div class="backup-msg info">복원이 완료됐어요.</div>
      <div class="btn-row-inline">
        <button class="btn-save" id="doneClose">확인</button>
      </div>
    `;
  }

  overlay.innerHTML = `
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="modal-title">백업 / 복원</div>
        <div class="modal-close" id="backupCloseBtn">✕</div>
      </div>
      ${body}
    </div>
  `;

  centerText(overlay);
  document.getElementById("backupCloseBtn").addEventListener("click", closeBackupModal);

  const doExport = document.getElementById("doExport");
  if (doExport) doExport.addEventListener("click", () => { exportBackup(); closeBackupModal(); });

  const doImportPick = document.getElementById("doImportPick");
  const importFile = document.getElementById("importFile");
  if (doImportPick) doImportPick.addEventListener("click", () => importFile.click());
  if (importFile) importFile.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.items)) throw new Error("invalid");
        state.backupPending = {
          items: data.items,
          categories: Array.isArray(data.categories) ? data.categories : state.categories,
          nations: Array.isArray(data.nations) ? data.nations : state.nations,
          count: data.items.length,
        };
        state.backupStep = "confirmImport";
      } catch (err) {
        state.backupErrorMsg = "올바른 백업 파일이 아니에요. 다른 파일을 선택해주세요.";
        state.backupStep = "error";
      }
      renderBackupModal();
    };
    reader.readAsText(file);
  });

  const importCancel = document.getElementById("importCancel");
  if (importCancel) importCancel.addEventListener("click", () => { state.backupStep = "menu"; state.backupPending = null; renderBackupModal(); });

  const importConfirm = document.getElementById("importConfirm");
  if (importConfirm) importConfirm.addEventListener("click", () => {
    state.items = state.backupPending.items;
    state.categories = state.backupPending.categories;
    state.nations = state.backupPending.nations;
    ensureAddedDates();
    persistItems();
    persistCategories();
    persistNations();
    state.backupStep = "done";
    renderBackupModal();
    render();
  });

  const errorBack = document.getElementById("errorBack");
  if (errorBack) errorBack.addEventListener("click", () => { state.backupStep = "menu"; renderBackupModal(); });

  const doneClose = document.getElementById("doneClose");
  if (doneClose) doneClose.addEventListener("click", closeBackupModal);
}

function starInputMarkup(value) {
  let svgs = "";
  for (let i = 0; i < 5; i++) {
    const fill = Math.max(0, Math.min(1, value - i));
    svgs += `
      <div style="position:relative;width:28px;height:28px;">
        <svg width="28" height="28" viewBox="0 0 24 24" style="position:absolute;top:0;left:0;">
          <path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8L6 21l1.6-7L2.2 9.2l7.1-.6L12 2z" fill="none" stroke="#b8a97e" stroke-width="1.3"/>
        </svg>
        <div style="position:absolute;top:0;left:0;width:${fill * 100}%;height:28px;overflow:hidden;">
          <svg width="28" height="28" viewBox="0 0 24 24">
            <path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8L6 21l1.6-7L2.2 9.2l7.1-.6L12 2z" fill="#b23a2f" stroke="#b23a2f" stroke-width="1.3"/>
          </svg>
        </div>
        <div class="star-half" data-i="${i}" data-half="1" style="position:absolute;top:0;left:0;width:50%;height:100%;"></div>
        <div class="star-half" data-i="${i}" data-half="0" style="position:absolute;top:0;right:0;width:50%;height:100%;"></div>
      </div>
    `;
  }
  return svgs;
}

function openModal(item) {
  state.modal = true;
  state.modalDraft = item ? { ...item } : {
    id: uid(), title: "", category: state.categories[0] || "영화", country: state.country,
    nation: state.nations[0] || "", status: "볼 예정", rating: 0, completedDate: "", holdDate: "", memo: "", createdAt: Date.now(), addedDate: todayStr(),
    currentEp: 0, totalEp: "",
  };
  state.modalIsEdit = !!item;
  renderModal();
}

function closeModal() {
  state.modal = null;
  const existing = document.getElementById("overlay");
  if (existing) existing.remove();
}

function renderModal() {
  let overlay = document.getElementById("overlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "overlay";
    overlay.className = "overlay";
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  }
  const d = state.modalDraft;

  overlay.innerHTML = `
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="modal-title">${state.modalIsEdit ? "기록 수정" : "새 기록 추가"}</div>
        <div class="modal-close" id="closeBtn">✕</div>
      </div>

      <div class="field-label">TITLE</div>
      <input type="text" id="titleInput" value="${escapeHtml(d.title)}" placeholder="제목을 입력하세요" />

      <div class="field-label">장르</div>
      <div class="pill-row" id="categoryRow">
        ${state.categories.map((c) => `<div class="pick-pill ${d.category === c ? "on" : ""}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join("")}
        <div class="pick-pill" id="addGenreBtn">＋ 추가</div>
      </div>
      <div id="addGenreInputWrap" style="display:none;margin-top:8px;gap:6px;">
        <input type="text" id="newGenreInput" placeholder="새 장르 이름" style="width:70%;display:inline-block;" />
        <div class="pick-pill on" id="confirmGenreBtn" style="display:inline-block;">확인</div>
      </div>

      <div class="field-label">국내 / 해외</div>
      <div class="pill-row" id="countryRow">
        <div class="pick-pill ${d.country === "국내" ? "on" : ""}" data-country="국내">국내</div>
        <div class="pick-pill ${d.country === "해외" ? "on" : ""}" data-country="해외">해외</div>
      </div>

      ${d.country === "해외" ? `
        <div class="field-label">국가</div>
        <div class="pill-row" id="nationRow">
          ${state.nations.map((n) => `<div class="pick-pill ${d.nation === n ? "on" : ""}" data-nation="${escapeHtml(n)}">${escapeHtml(n)}</div>`).join("")}
          <div class="pick-pill" id="addNationBtn">＋ 추가</div>
        </div>
        <div id="addNationInputWrap" style="display:none;margin-top:8px;gap:6px;">
          <input type="text" id="newNationInput" placeholder="새 국가 이름" style="width:70%;display:inline-block;" />
          <div class="pick-pill on" id="confirmNationBtn" style="display:inline-block;">확인</div>
        </div>
      ` : ""}

      <div class="field-label">상태</div>
      <div class="pill-row" id="statusRow">
        ${STATUSES.map((s) => `<div class="pick-pill ${d.status === s ? "on" : ""}" data-status="${s}">${s}</div>`).join("")}
      </div>

      <div class="field-label">별점</div>
      <div class="star-input" id="starInput">${starInputMarkup(d.rating || 0)}</div>

      ${d.category !== "영화" ? `
        <div class="field-label">회차${d.category === "드라마" ? "" : " (선택)"}</div>
        <div style="display:flex; gap:8px;">
          <input type="number" id="currentEpInput" min="0" value="${d.currentEp || (d.category === "드라마" ? 0 : "")}" placeholder="현재 화" style="flex:1;" />
          <input type="number" id="totalEpInput" min="0" value="${d.totalEp || ""}" placeholder="총 화수 (선택)" style="flex:1;" />
        </div>
      ` : ""}

      <div class="field-label">추가일</div>
      <input type="date" id="addedDateInput" value="${d.addedDate || ""}" />

      ${d.status === "완료" ? `
        <div class="field-label">완료일</div>
        <input type="date" id="dateInput" value="${d.completedDate || ""}" />
      ` : ""}

      ${d.status === "보류" ? `
        <div class="field-label">보류일</div>
        <input type="date" id="holdDateInput" value="${d.holdDate || ""}" />
      ` : ""}

      <div class="field-label">메모 (선택)</div>
      <textarea id="memoInput" rows="2" placeholder="짧은 감상평...">${escapeHtml(d.memo)}</textarea>

      <div class="btn-row">
        ${state.modalIsEdit ? `<div class="btn-delete" id="deleteBtn">삭제</div>` : ""}
        <button class="btn-save" id="saveBtn">${state.modalIsEdit ? "저장하기" : "추가하기"}</button>
      </div>
    </div>
  `;

  centerText(overlay);
  document.getElementById("closeBtn").addEventListener("click", closeModal);
  document.getElementById("titleInput").addEventListener("input", (e) => { d.title = e.target.value; });
  document.getElementById("memoInput").addEventListener("input", (e) => { d.memo = e.target.value; });
  const currentEpInput = document.getElementById("currentEpInput");
  if (currentEpInput) currentEpInput.addEventListener("input", (e) => { d.currentEp = Math.max(0, parseInt(e.target.value, 10) || 0); });
  const totalEpInput = document.getElementById("totalEpInput");
  if (totalEpInput) totalEpInput.addEventListener("input", (e) => { d.totalEp = e.target.value ? Math.max(0, parseInt(e.target.value, 10) || 0) : ""; });
  const addedDateInput = document.getElementById("addedDateInput");
  if (addedDateInput) addedDateInput.addEventListener("input", (e) => { d.addedDate = e.target.value; });
  const dateInput = document.getElementById("dateInput");
  if (dateInput) dateInput.addEventListener("input", (e) => { d.completedDate = e.target.value; });
  const holdDateInput = document.getElementById("holdDateInput");
  if (holdDateInput) holdDateInput.addEventListener("input", (e) => { d.holdDate = e.target.value; });

  document.querySelectorAll("#categoryRow .pick-pill[data-cat]").forEach((el) => el.addEventListener("click", () => {
    d.category = el.dataset.cat; renderModal();
  }));
  document.getElementById("addGenreBtn").addEventListener("click", () => {
    document.getElementById("addGenreInputWrap").style.display = "block";
    document.getElementById("newGenreInput").focus();
  });
  document.getElementById("confirmGenreBtn").addEventListener("click", () => {
    const val = document.getElementById("newGenreInput").value.trim();
    if (val && !state.categories.includes(val)) {
      state.categories.push(val);
      persistCategories();
    }
    if (val) d.category = val;
    renderModal();
  });

  document.querySelectorAll("#countryRow .pick-pill").forEach((el) => el.addEventListener("click", () => {
    d.country = el.dataset.country;
    if (d.country === "해외" && !d.nation) d.nation = state.nations[0] || "";
    renderModal();
  }));
  const nationRow = document.getElementById("nationRow");
  if (nationRow) nationRow.querySelectorAll(".pick-pill[data-nation]").forEach((el) => el.addEventListener("click", () => {
    d.nation = el.dataset.nation; renderModal();
  }));
  const addNationBtn = document.getElementById("addNationBtn");
  if (addNationBtn) addNationBtn.addEventListener("click", () => {
    document.getElementById("addNationInputWrap").style.display = "block";
    document.getElementById("newNationInput").focus();
  });
  const confirmNationBtn = document.getElementById("confirmNationBtn");
  if (confirmNationBtn) confirmNationBtn.addEventListener("click", () => {
    const val = document.getElementById("newNationInput").value.trim();
    if (val && !state.nations.includes(val)) {
      state.nations.push(val);
      persistNations();
    }
    if (val) d.nation = val;
    renderModal();
  });
  document.querySelectorAll("#statusRow .pick-pill").forEach((el) => el.addEventListener("click", () => {
    d.status = el.dataset.status;
    if (d.status === "완료" && !d.completedDate) d.completedDate = todayStr();
    if (d.status === "보류" && !d.holdDate) d.holdDate = todayStr();
    renderModal();
  }));

  document.querySelectorAll(".star-half").forEach((el) => el.addEventListener("click", () => {
    const i = Number(el.dataset.i);
    const half = el.dataset.half === "1";
    const newVal = i + (half ? 0.5 : 1);
    d.rating = newVal === d.rating ? 0 : newVal;
    renderModal();
  }));

  document.getElementById("saveBtn").addEventListener("click", () => {
    if (!d.title.trim()) { document.getElementById("titleInput").focus(); return; }
    if (!d.addedDate) d.addedDate = dateFromTs(d.createdAt) || todayStr();
    if (d.status !== "완료") d.completedDate = "";
    else if (!d.completedDate) d.completedDate = todayStr();
    if (d.status !== "보류") d.holdDate = "";
    else if (!d.holdDate) d.holdDate = todayStr();
    if (d.category === "영화") { d.currentEp = 0; d.totalEp = ""; }
    d.title = d.title.trim();
    d.memo = (d.memo || "").trim();

    const idx = state.items.findIndex((i) => i.id === d.id);
    if (idx >= 0) state.items[idx] = d; else state.items.push(d);
    persistItems();
    closeModal();
    render();
  });

  const deleteBtn = document.getElementById("deleteBtn");
  if (deleteBtn) deleteBtn.addEventListener("click", () => {
    state.items = state.items.filter((i) => i.id !== d.id);
    persistItems();
    closeModal();
    render();
  });
}

loadAll();

// PWA: 홈 화면에 추가했을 때 오프라인에서도 열리도록 서비스워커 등록
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* GitHub Pages 등 https 환경이 아니면 무시 */ });
  });
  // 새 버전의 서비스워커가 활성화되면 자동으로 한 번 새로고침해서 최신 화면을 바로 보여줌
  var refreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (refreshed) return;
    refreshed = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
